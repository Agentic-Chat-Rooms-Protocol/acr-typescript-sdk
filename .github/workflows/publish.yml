name: Publish Package to npmjs

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build & Publish @acr-js/sdk
    runs-on: ubuntu-latest
    env:
      NPM_REGISTRY_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN || secrets.NODE_AUTH_TOKEN || secrets.NPM_TOKEN }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Check Authentication Token Presence
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "NPM authentication token is present in runner environment (length: ${#NODE_AUTH_TOKEN} chars)"
          else
            echo "::error::NPM authentication token is EMPTY or NOT AVAILABLE in this repository context"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN || secrets.NODE_AUTH_TOKEN || secrets.NPM_TOKEN }}

      - name: Configure User npm Registry Auth & Verify
        run: |
          npm config set //registry.npmjs.org/:_authToken "${NODE_AUTH_TOKEN}"
          echo "Verifying npm credentials via whoami:"
          npm whoami --registry https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN || secrets.NODE_AUTH_TOKEN || secrets.NPM_TOKEN }}

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build TypeScript Output
        run: npm run build

      - name: Run Test Verification
        run: npm test

      - name: Publish Package to npmjs
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN || secrets.NODE_AUTH_TOKEN || secrets.NPM_TOKEN }}

